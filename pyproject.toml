[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantfolio"
dynamic = ["version"]
description = "One-stop CLI for equity analysis: market data, portfolio optimization, factor models, econometrics, and goal planning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "JJ Espinoza", email = "jj.espinoza.la@gmail.com" }]
keywords = ["finance", "portfolio", "markowitz", "fama-french", "fire", "cli", "econometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]

# Base install = the whole CLI. Heavy/optional backends live in extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "pandas-datareader>=0.10"]
econ = ["statsmodels>=0.14"]
opt = ["cvxpy>=1.5"]
all = ["quantfolio[data,econ,opt]"]
dev = [
  "quantfolio[all]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-requests",
]

[project.scripts]
qf = "quantfolio.cli.main:app"
quantfolio = "quantfolio.cli.main:app"

[project.urls]
Homepage = "https://github.com/espin086/Stocks"
Issues = "https://github.com/espin086/Stocks/issues"

[tool.hatch.version]
path = "src/quantfolio/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: test requires live network access (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Spec documents contain illustrative Python snippets that are deliberately
# abbreviated -- prose, not code to be formatted. `legacy_code/` is the
# pre-quantfolio R/Python work, preserved as-is for reference and for the 0002
# regression fixtures; it is deliberately not held to this project's standards.
extend-exclude = ["*.md", "legacy_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["quantfolio"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas_datareader.*", "statsmodels.*", "cvxpy.*", "scipy.*"]
ignore_missing_imports = true
