[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sobres"
dynamic = ["version"]
description = "One-stop CLI for equity analysis: market data, portfolio optimization, factor models, econometrics, and goal planning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "JJ Espinoza", email = "jj.espinoza.la@gmail.com" }]
keywords = ["finance", "portfolio", "markowitz", "fama-french", "fire", "cli", "econometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

# Base install = the whole CLI. Heavy/optional backends live in extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "httpx>=0.27",
  "structlog>=24.1",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "pandas-datareader>=0.10"]
econ = ["statsmodels>=0.14"]
opt = ["cvxpy>=1.5"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
all = ["sobres[data,econ,opt,otel,web]"]
dev = [
  "sobres[all]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-requests",
]

[project.scripts]
sobres = "sobres.cli.main:app"

[project.urls]
Homepage = "https://github.com/AI-Solutions-Lab-LLC/sobres"
Issues = "https://github.com/AI-Solutions-Lab-LLC/sobres/issues"
Changelog = "https://github.com/AI-Solutions-Lab-LLC/sobres/blob/main/CHANGELOG.md"
Source = "https://github.com/AI-Solutions-Lab-LLC/sobres"

[tool.hatch.version]
path = "src/sobres/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sobres"]
# The built SPA ships in the wheel so `pip install sobres[web]` needs no Node.
artifacts = ["src/sobres/api/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is a package (tests/conftest.py, tests/data/contracts.py are imported by name),
# so the repository root must be importable whether pytest is run as `pytest` or `python -m pytest`.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "network: test requires live network access (deselect with '-m \"not network\"')",
  "slow: test takes more than five seconds; the reason is in a comment beside it",
]
filterwarnings = [
  "ignore::DeprecationWarning:structlog.*",
]

[tool.coverage.run]
source = ["sobres"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Spec documents contain illustrative Python snippets that are deliberately
# abbreviated -- prose, not code to be formatted. `legacy_code/` is the
# pre-rewrite R/Python work, preserved as-is for reference and for the 0002
# regression fixtures; it is deliberately not held to this project's standards.
extend-exclude = ["*.md", "legacy_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Math tests quote formulas with Greek letters in comments and docstrings.
"tests/core/*" = ["RUF002", "RUF003"]

[tool.mypy]
# No pinned python_version: check under the interpreter that runs mypy. Third-party stubs
# (numpy 2.5+) use `type` statements that a 3.11 target rejects even on a 3.12 interpreter.
packages = ["sobres"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas_datareader.*", "statsmodels.*", "cvxpy.*", "scipy.*", "opentelemetry.*", "uvicorn.*"]
ignore_missing_imports = true
