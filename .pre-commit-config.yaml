# The same gate CI runs, before a commit exists. Install once per clone:
#   pip install -e ".[dev]" pre-commit && pre-commit install
# A commit that fails here would fail the Lint, Format or Type check job, so
# fixing it locally is always cheaper. `pre-commit run --all-files` runs it by hand.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(legacy_code/|tests/fixtures/)
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^(legacy_code/|tests/fixtures/)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        # A bad workflow expression fails the run before any job starts, with no log.

  # ruff and mypy run from the project's own environment (`pip install -e ".[dev]"`),
  # exactly as CI runs them: same versions, same config, same dependencies for mypy.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy --strict (src/sobres)
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: ^(src/sobres/.*\.py|pyproject\.toml)$
