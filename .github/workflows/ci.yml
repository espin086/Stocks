name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Callable by release.yml so a release runs the exact same gates, not a copy
  # of them that can drift.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

      - name: Lint GitHub Actions workflows
        # These workflows are code, and they fail in a way no unit test can
        # catch: an invalid expression is rejected before any job starts, so the
        # run reports failure with zero jobs and no log to read.
        # Pinned release download rather than a third-party action or a
        # curl-piped-to-bash installer.
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy

  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Cross-platform coverage on the primary interpreter only. Path
          # handling and the on-disk cache are the parts that break on Windows.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        # Network-marked tests hit live providers; a vendor outage must never
        # turn this repo red. Run them deliberately with `pytest -m network`.
        run: pytest -m "not network" --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend (types, client drift, bundle budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - name: The committed OpenAPI document matches the registry
        # The TypeScript client is generated from this file; drift is a build
        # failure here rather than a runtime one in the browser.
        run: python scripts/export_openapi.py --check
      - run: npm ci
        working-directory: frontend
      - name: The generated client matches the OpenAPI document
        run: npm run check:client
        working-directory: frontend
      - name: Type check, build, bundle budget
        # `build` runs tsc --strict, vite, then the 300 KB gzip gate.
        run: npm run build
        working-directory: frontend
      - name: Upload the built SPA
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static
          path: src/sobres/api/static/
          if-no-files-found: error

  build:
    name: Build and verify distributions
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm-style tooling and changelog checks want real history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Fetch the built SPA
        # The wheel ships the frontend at sobres/api/static so `pip install
        # sobres[web]` needs no Node.
        uses: actions/download-artifact@v8
        with:
          name: frontend-static
          path: src/sobres/api/static/

      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build

      - name: The wheel carries the SPA
        run: unzip -l dist/*.whl | grep -q "sobres/api/static/index.html"

      - name: twine check
        run: twine check --strict dist/*

      - name: Install the built wheel in a clean environment
        # Proves the artifact users actually download works -- catches missing
        # package data, a broken entry point, or an import that only resolves
        # from the source tree.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[web]"
          /tmp/smoke/bin/sobres --version
          /tmp/smoke/bin/sobres serve --help > /dev/null
          /tmp/smoke/bin/python -c "import sobres; print(sobres.__version__)"

      - name: The three-command path, in the clean environment
        # Onboarding is tested end to end: init, doctor, then one data command
        # served from the recorded fixtures rather than the network.
        env:
          SOBRES_CONFIG_FILE: /tmp/smoke-home/config.toml
          SOBRES_DB_URL: sqlite:////tmp/smoke-home/sobres.db
          SOBRES_FIXTURE_DIR: ${{ github.workspace }}/tests/fixtures
        run: |
          /tmp/smoke/bin/sobres init --non-interactive --offline
          /tmp/smoke/bin/sobres doctor --offline
          /tmp/smoke/bin/sobres data prices AAPL MSFT --start 2020-01-01 --end 2020-03-31 --format csv \
            | head -5
          /tmp/smoke/bin/sobres data prices AAPL MSFT --start 2020-01-01 --end 2020-03-31 --format json \
            | /tmp/smoke/bin/python -c "import json,sys; d=json.load(sys.stdin); assert d['columns']==['AAPL','MSFT'], d['columns']; print(len(d['rows']), 'rows')"

      - name: Confirm the sdist builds a wheel
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/pip install --upgrade pip build
          /tmp/sdist/bin/pip wheel --no-deps -w /tmp/sdist-out dist/*.tar.gz

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" pip-audit

      - name: Resolve the dependency tree
        # Audit what this project actually pulls in, across every extra --
        # `--exclude-editable` drops the local project (which is not on any
        # index and so can never be audited), and `pip freeze` already omits
        # pip/setuptools/wheel, whose advisories belong to the runner image
        # rather than to this codebase. Auditing the ambient environment
        # instead would fail on whatever pip version the runner happens to ship.
        run: pip freeze --exclude-editable > requirements-audit.txt

      - name: pip-audit
        # A known vulnerability blocks merge and release by design. To ship past
        # an unfixable transitive advisory, add `--ignore-vuln <ID>` here with a
        # comment saying why -- see docs/RELEASING.md.
        run: pip-audit --strict --progress-spinner=off -r requirements-audit.txt

  # Single required status check. Branch protection points at this one job, so
  # the matrix above can grow or shrink without editing protection rules.
  all-green:
    name: All checks passed
    if: always()
    needs: [lint, typecheck, test, frontend, build, security]
    runs-on: ubuntu-latest
    steps:
      # `if: always()` means this job runs even when a dependency failed, so it
      # must inspect the results itself rather than rely on job ordering.
      # Anything that is not `success` -- failed, cancelled, or skipped -- is a
      # red gate; a skipped required job must never read as passing.
      #
      # The condition lives on the step, not in shell. A multi-line `${{ }}`
      # interpolated into an `if` statement expands to a continuation line
      # starting with `||`, which bash rejects as a syntax error -- so the gate
      # would fail even when every job passed.
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Required jobs did not all succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: All required jobs succeeded
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
